# Environnement uv pour Ultimate Vocal Remover v5.6 (tâche 2.3).
# Copier ce fichier, ainsi que uv.lock et .python-version, à la racine de
# external/ultimatevocalremovergui, puis lancer : uv sync && uv run UVR.py
#
# Construit à partir du requirements.txt de UVR v5.6 :
# - torch==1.9.0+cu111 est remplacé par un torch CPU récent (pas de GPU NVIDIA
#   sur la machine). Il faut torch>=2.5, car les scripts du cours appellent
#   torch.onnx.export(..., dynamo=False, opset_version=17).
# - Les versions qui comptent pour UVR restent épinglées : numpy<1.24,
#   librosa 0.9.2, onnxruntime 1.13.1, pytorch_lightning 2.0.0.
# - certifi, urllib3 et cryptography ne sont plus épinglés : les
#   versions de 2022 n'apportent rien à UVR et des certificats racine trop vieux
#   cassent les téléchargements HTTPS (centre de téléchargement, Zenodo).
# - pip et PySoundFile sont retirés : uv n'a pas besoin de pip, et PySoundFile
#   est l'ancien nom de soundfile.
# Les contraintes relâchées à cause d'un conflit sont signalées par « RELÂCHÉ ».

[project]
name = "uvr-env"
version = "0.1.0"
description = "Ultimate Vocal Remover v5.6 + entraînement/scoring MDX-Net (ML Tek5, tâche 2.3)"
# .python-version épingle 3.10.18, qui embarque Tk 8.6. Le build uv 3.10.22
# embarque Tk 9, avec lequel la lib tkdnd 2.9.2 fournie par UVR ne se charge pas.
requires-python = "==3.10.*"
dependencies = [
    # --- Cœur audio / inférence de UVR ---
    "numpy>=1.23.4,<1.24",
    "librosa==0.9.2",
    # librosa 0.9.2 importe pkg_resources, retiré de setuptools à partir de la 81.
    "setuptools<81",
    # RELÂCHÉ (était ==0.2.2) : matchering 2.0.6 exige resampy>=0.4.2.
    "resampy>=0.4.2",
    "onnxruntime==1.13.1",
    "soundfile>=0.11.0",
    "audioread==3.0.0",
    "scipy>=1.9.3,<1.12",
    "samplerate==0.1.0",
    "pydub==0.25.1",
    "pyrubberband==0.3.0",
    "soundstretch==1.2",
    "matchering==2.0.6",
    # --- Modèles (demucs, VR) ---
    "diffq==0.2.3",
    # RETIRÉ : Dora==0.0.3 sur PyPI est un outil d'analyse exploratoire sans
    # rapport avec UVR, jamais importé ; il dépend du paquet « sklearn » obsolète,
    # qui refuse de s'installer.
    "einops==0.6.0",
    "julius==0.2.7",
    "ml_collections==0.1.1",
    "omegaconf==2.2.3",
    "pytorch_lightning==2.0.0",
    "onnx2pytorch",
    # --- GUI et utilitaires ---
    "opencv-python==4.6.0.66",
    # UVR utilise Image.ANTIALIAS, retiré dans Pillow 10.
    "Pillow>=9.3.0,<10",
    # RELÂCHÉ (était ==1.3.0) : la sdist 1.3.0 ne se construit pas avec un
    # setuptools récent ; la 1.2.2 existe en wheel, avec la même API playsound().
    "playsound==1.2.2",
    "pyglet==1.5.23",
    "pyperclip==1.8.2",
    "screeninfo==0.8.1",
    "psutil>=5.9.4",
    "natsort==8.2.0",
    "kthread==0.2.3",
    "future==0.18.2",
    "altgraph==0.17.3",
    "PyYAML>=6.0",
    "wget==3.2",
    "tqdm",
    "certifi",
    "urllib3<2",
    "cffi",
    "cryptography",
    # --- Ajouts pour le projet : entraînement, export ONNX, SDR ---
    "torch>=2.5",
    # Dépendance d'onnx2pytorch, déclarée ici pour qu'elle vienne de l'index CPU,
    # comme torch (tool.uv.sources ne s'applique qu'aux dépendances directes).
    "torchvision",
    "onnx",
    "museval",
    "mir_eval",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
